<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KaamDwaar — Gateway to Fair Work</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%9D%3C/text%3E%3C/svg%3E">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#f5f2ea; --surface:#ffffff; --surface2:#ede8dc; --text:#20261f; --muted:#6d7266;
  --primary:#0f6b4e; --primary2:#0b5940; --primary-soft:#e0efe6;
  --accent:#dd8f1c; --accent-soft:#fbf0da;
  --border:#e2dccd; --danger:#c2410c; --danger-soft:#fdeadd; --ok:#15803d; --info:#1d4ed8;
  --shadow:0 8px 24px rgba(35,45,35,.08); --shadow-lg:0 18px 50px rgba(35,45,35,.16);
  --r:14px;
}
[data-theme="dark"]{
  --bg:#121511; --surface:#1a1f19; --surface2:#232a22; --text:#e9e7db; --muted:#9aa08f;
  --primary:#2fa27b; --primary2:#3cb98d; --primary-soft:#17302570;
  --accent:#e8a33d; --accent-soft:#3a2d1470;
  --border:#2c332a; --danger:#f97316; --danger-soft:#3b241280; --ok:#4ade80; --info:#93c5fd;
  --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 18px 50px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari','Noto Sans Oriya',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;font-size:15px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
img,svg{vertical-align:middle}
.container{max-width:1140px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp-between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mt{margin-top:14px}.mt-lg{margin-top:26px}.mb{margin-bottom:14px}
a{color:inherit;text-decoration:none;cursor:pointer}

/* ============================= HEADER ============================= */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar .container{display:flex;align-items:center;justify-content:space-between;gap:12px;height:112px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand-logo{height:92px;width:auto;display:block}
footer .brand-logo{height:72px}
.brand-txt b{font-size:17px;display:block;line-height:1.1}
.brand-txt span{font-size:11px;color:var(--muted);letter-spacing:.4px}
.nav-actions{display:flex;align-items:center;gap:8px}
.lang-sel{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px 8px;color:var(--text)}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn:hover{border-color:var(--primary)}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:4px 12px 4px 5px;font-weight:600;font-size:13.5px}
.user-chip .role-tag{font-size:10.5px;color:var(--muted);font-weight:600;display:block;line-height:1}

@media(max-width:760px){
  .topbar .container{height:96px}
  .brand-logo{height:74px;max-width:72vw}
  footer .brand-logo{height:58px;max-width:85vw}
}

/* ============================= BUTTONS ============================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid transparent;
  padding:10px 18px;font-weight:600;font-size:14px;transition:.15s;background:var(--surface2);color:var(--text)}
.btn:hover{filter:brightness(.97)}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary2);filter:none}
.btn-ac{background:var(--accent);color:#fff}
.btn-o{background:transparent;border-color:var(--border);color:var(--text)}
.btn-o:hover{border-color:var(--primary);color:var(--primary)}
.btn-g{background:transparent;color:var(--muted)}
.btn-g:hover{color:var(--text)}
.btn-dgr{background:var(--danger);color:#fff}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn-lg{padding:13px 24px;font-size:15.5px;border-radius:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ============================= GENERIC UI ============================= */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);
  border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;color:var(--text)}
.chip.p{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.chip.a{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.vbadge{display:inline-flex;align-items:center;gap:4px;background:var(--primary-soft);color:var(--primary);
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.pbadge{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);color:var(--accent);
  font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.avatar{width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;display:inline-flex;
  align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.avatar.sm{width:34px;height:34px;font-size:12.5px}
.avatar.lg{width:64px;height:64px;font-size:21px}
.empty{padding:34px;text-align:center;color:var(--muted);border:1.5px dashed var(--border);border-radius:var(--r)}
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);
  color:var(--text);border-radius:12px;padding:11px 15px;font-size:13.5px;margin-bottom:16px}
.st{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;display:inline-block}
.st-open{background:var(--primary-soft);color:var(--primary)}
.st-hired{background:#dbeafe;color:#1d4ed8}
[data-theme="dark"] .st-hired{background:#1e3a5f;color:#93c5fd}
.st-done{background:var(--surface2);color:var(--muted)}
.st-warn{background:var(--danger-soft);color:var(--danger)}
.st-ok{background:var(--primary-soft);color:var(--ok)}
.st-acc{background:var(--primary-soft);color:var(--ok)}
.st-rej{background:var(--danger-soft);color:var(--danger)}
.st-pend{background:var(--accent-soft);color:var(--accent)}
.stars{color:var(--accent);font-size:13px;letter-spacing:1px}
.stars b{color:var(--text)}

/* ============================= FORMS ============================= */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--text)}
.input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);
  color:var(--text);outline:none;transition:.15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
textarea.input{resize:vertical;min-height:84px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
.chk{display:inline-flex;cursor:pointer}
.chk input{display:none}
.chk span{display:inline-block;background:var(--surface2);border:1.5px solid var(--border);border-radius:999px;
  padding:5px 13px;font-size:12.5px;font-weight:600;transition:.12s;color:var(--text)}
.chk input:checked+span{background:var(--primary);border-color:var(--primary);color:#fff}
.chip-sel{display:flex;flex-wrap:wrap;gap:7px}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;font-weight:600}
.checkline input{width:16px;height:16px;accent-color:var(--primary)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.fair-hint{background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:12.5px;
  border-radius:9px;padding:8px 12px;margin-top:6px;display:none}

/* ============================= HERO / HOME ============================= */
.sec{padding:54px 0}
.hero{padding:64px 0 46px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-140px;top:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%)}
.hero::after{content:"";position:absolute;left:-160px;bottom:-160px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--primary) 18%,transparent),transparent 70%)}
.hero .container{display:grid;grid-template-columns:1.15fr .85fr;gap:44px;align-items:center;position:relative;z-index:1}
.kicker{display:inline-flex;align-items:center;gap:7px;background:var(--primary-soft);color:var(--primary);
  font-weight:700;font-size:12.5px;border-radius:999px;padding:6px 14px;margin-bottom:18px}
.hero h1{font-size:clamp(30px,4.6vw,46px);line-height:1.14;letter-spacing:-.5px}
.hero h1 .c-p{color:var(--primary)} .hero h1 .c-a{color:var(--accent)}
.hero-sub{margin:16px 0 24px;color:var(--muted);font-size:16px;max-width:520px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-art{position:relative;min-height:340px}
.mock{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:16px;
  box-shadow:var(--shadow-lg);padding:16px;width:270px;pointer-events:none}
.mock-worker{top:18px;right:34px;transform:rotate(2.5deg)}
.mock-job{top:150px;left:0;transform:rotate(-3deg)}
.float-chip{position:absolute;right:6px;bottom:16px;background:var(--accent);color:#fff;font-weight:800;
  font-size:12.5px;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow-lg);transform:rotate(-2deg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{text-align:center;padding:18px 10px}
.stat b{font-size:26px;display:block;color:var(--primary)}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
.sec-hd{text-align:center;max-width:640px;margin:0 auto 30px}
.sec-hd h2{font-size:clamp(22px,3vw,30px);letter-spacing:-.4px}
.sec-hd p{color:var(--muted);margin-top:8px}
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center}
.step{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.step-n{width:21px;height:21px;border-radius:50%;background:var(--primary);color:#fff;font-size:11px;
  display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.step-arrow{color:var(--muted);font-weight:700}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.feat{padding:22px;transition:.18s}
.feat:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.feat-ic{font-size:26px;width:50px;height:50px;border-radius:13px;background:var(--primary-soft);
  display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.feat b{font-size:15.5px;display:block;margin-bottom:5px}
.feat p{font-size:13.5px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  padding:9px 12px;border-bottom:2px solid var(--border)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--border)}
.tbl tr:last-child td{border-bottom:none}
.cta-band{text-align:center;padding:48px 20px}
footer{border-top:1px solid var(--border);padding:26px 0;text-align:center;color:var(--muted);font-size:13px}
footer .brand{justify-content:center;margin-bottom:8px}

/* ============================= AUTH ============================= */
.auth-wrap{max-width:560px;margin:44px auto;padding:0 20px}
.auth-card{padding:28px}
.auth-card h2{font-size:22px;margin-bottom:4px}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 18px}
.role-card{border:2px solid var(--border);border-radius:13px;padding:16px;text-align:center;cursor:pointer;transition:.14s;background:var(--surface)}
.role-card .rc-ic{font-size:26px}
.role-card b{display:block;margin-top:6px;font-size:15px}
.role-card span{font-size:12px;color:var(--muted)}
.role-card.sel{border-color:var(--primary);background:var(--primary-soft)}
.demo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.demo-card{border:1px solid var(--border);border-radius:12px;padding:11px;font-size:12px;text-align:center;background:var(--surface2)}
.demo-card b{display:block;font-size:12.5px}
.demo-card .muted{display:block;margin:2px 0 7px;font-size:11px;word-break:break-all}

/* ============================= DASHBOARD ============================= */
.dash{padding:26px 0 60px}
.dhead{padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.dhead h2{font-size:20px;line-height:1.2}
.dhead .sub{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.tab{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;
  padding:8px 16px;font-size:13.5px;font-weight:600;transition:.14s;display:inline-flex;align-items:center;gap:7px}
.tab:hover{border-color:var(--primary);color:var(--primary)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.tcount{background:var(--danger);color:#fff;font-size:10.5px;font-weight:800;border-radius:999px;
  padding:1px 7px;min-width:18px;text-align:center}
.filterbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filterbar .input{width:auto;min-width:150px;padding:8px 11px}
.filterbar .grow{flex:1;min-width:180px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.jcard{padding:17px;display:flex;flex-direction:column;gap:10px}
.jcard h3{font-size:15.5px;line-height:1.3}
.jcard-ft{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.wcard{padding:17px;display:flex;flex-direction:column;gap:10px}
.wcard-hd{display:flex;gap:12px;align-items:center}
.approw{display:flex;gap:14px;align-items:center;padding:15px 17px;flex-wrap:wrap}
.approw .grow{flex:1;min-width:200px}
.ocard{padding:17px;display:flex;flex-direction:column;gap:9px}
.quote{border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 9px 9px 0;
  padding:8px 12px;font-size:13px;color:var(--muted);font-style:italic}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.scard{padding:17px;text-align:center}
.scard b{font-size:25px;color:var(--primary);display:block}
.scard span{font-size:12px;color:var(--muted);font-weight:600}
.comprow{padding:16px 17px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}

/* ============================= CHAT ============================= */
.chat-wrap{display:grid;grid-template-columns:280px 1fr;border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;background:var(--surface);min-height:440px;box-shadow:var(--shadow)}
.threads{border-right:1px solid var(--border);background:var(--surface2);overflow-y:auto;max-height:520px}
.thread{display:flex;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--border);align-items:center}
.thread:hover{background:color-mix(in srgb,var(--surface) 55%,transparent)}
.thread.active{background:var(--surface)}
.thread .grow{flex:1;min-width:0}
.thread b{font-size:13.5px;display:block}
.thread .prev{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chat-pane{display:flex;flex-direction:column;min-height:440px}
.chat-hd{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:700;display:flex;gap:10px;align-items:center}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:9px;max-height:360px;min-height:300px}
.bubble{max-width:74%;padding:9px 13px;border-radius:15px;font-size:13.5px;box-shadow:var(--shadow)}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;background:var(--surface2);border-bottom-left-radius:4px}
.bubble time{display:block;font-size:10px;opacity:.65;margin-top:3px}
.chat-in{display:flex;gap:8px;padding:11px;border-top:1px solid var(--border)}
.chat-in .input{flex:1}

/* ============================= CV ============================= */
.cv{background:#fff;color:#1c211b;border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.cv-hd{background:var(--primary);color:#fff;padding:24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cv-hd .avatar{background:#ffffff30;border:2px solid #fff8}
.cv-hd h3{font-size:21px;line-height:1.2}
.cv-hd .sub{opacity:.9;font-size:13px}
.cv-body{padding:22px;display:grid;grid-template-columns:1.5fr 1fr;gap:22px}
.cv-sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#0f6b4e;margin-bottom:8px;
  border-bottom:2px solid #e5efe8;padding-bottom:4px}
.cv-sec{margin-bottom:18px}
.cv-line{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;gap:10px}
.cv-line b{color:#52584e;font-weight:600}
.rev{border-left:3px solid #dd8f1c;padding:6px 11px;margin-bottom:9px;background:#faf7ef;border-radius:0 8px 8px 0;font-size:13px}
.rev .muted{font-size:11.5px;display:block;margin-top:2px}
.cv-foot{padding:12px 22px;background:#f4f7f3;font-size:11.5px;color:#6d7266}

/* ============================= MODAL / TOAST ============================= */
.overlay{position:fixed;inset:0;background:rgba(15,20,15,.55);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;max-width:600px;width:100%;
  max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-hd{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid var(--border)}
.modal-hd b{font-size:16px}
.xbtn{background:none;border:none;font-size:20px;color:var(--muted);line-height:1}
.modal-bd{padding:20px}
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;
  flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);animation:toastin .25s ease;max-width:90vw;text-align:center}
@keyframes toastin{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.rate-stars{font-size:32px;letter-spacing:4px;text-align:center;margin:8px 0 14px}
.rate-stars span{cursor:pointer;color:var(--border);transition:.1s}
.rate-stars span.on{color:var(--accent)}

/* ============================= PRINT (CV) ============================= */
#print-area{display:none}
@media print{
  body.print-cv>header,body.print-cv>#view,body.print-cv>footer,#modal-root,#toast-root{display:none!important}
  body.print-cv{background:#fff}
  body.print-cv #print-area{display:block!important}
  .cv{border:none;border-radius:0}
}

/* ============================= RESPONSIVE ============================= */
@media(max-width:960px){
  .hero .container{grid-template-columns:1fr}
  .hero-art{display:none}
  .feat-grid{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:1fr}
  .stats,.stat-grid{grid-template-columns:1fr 1fr}
  .chat-wrap{grid-template-columns:1fr}
  .threads{max-height:190px;border-right:none;border-bottom:1px solid var(--border)}
  .cv-body{grid-template-columns:1fr}
}
@media(max-width:600px){
  .feat-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .demo-grid{grid-template-columns:1fr}
  .role-grid{grid-template-columns:1fr}
  .brand-txt span{display:none}
  .user-chip .uc-txt{display:none}
}
</style>
</head>
<body>

<header class="topbar" id="topbar"></header>
<main id="view"></main>
<footer>

function loadDB(){try{const raw=localStorage.getItem(DBKEY);db=raw?JSON.parse(raw):seedDB();}catch(e){db=seedDB();}saveDB();}
function saveDB(){localStorage.setItem(DBKEY,JSON.stringify(db));}
function getUser(id){return db.users.find(u=>u.id===id);}
function getJob(id){return db.jobs.find(j=>j.id===id);}
function me(){const id=localStorage.getItem("ss_session");return id?getUser(id):null;}
function setSession(id){id?localStorage.setItem("ss_session",id):localStorage.removeItem("ss_session");}

/* ---------------- Ratings & reviews ---------------- */
function reviewsFor(uid){return db.reviews.filter(r=>r.to===uid).sort((a,b)=>b.ts-a.ts);}
function ratingOf(uid){const rs=db.reviews.filter(r=>r.to===uid);if(!rs.length)return null;
  return (rs.reduce((a,r)=>a+r.stars,0)/rs.length);}
function starsHtml(uid){const r=ratingOf(uid);if(r==null)return '<span class="stars small">'+t("new_lbl")+"</span>";
  return '<span class="stars">★ <b>'+r.toFixed(1)+"</b> <span class='muted small'>("+db.reviews.filter(x=>x.to===uid).length+")</span></span>";}
function hasReviewed(jobId,from){return db.reviews.some(r=>r.jobId===jobId&&r.from===from);}
function fairFlag(j){if(j.unit!=="day"||!FAIR[j.skill])return "";const f=FAIR[j.skill];
  return j.wage<f[0]?'<span class="st st-warn">'+t("below_fair")+"</span>":'<span class="st st-ok">'+t("fair_ok")+"</span>";}

/* ---------------- Toast & Modal ---------------- */
function toast(msg){const el=document.createElement("div");el.className="toast";el.innerHTML=msg;
  $("#toast-root").appendChild(el);setTimeout(()=>el.remove(),3200);}
function openModal(html){$("#modal-root").innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+"</div></div>";}
function closeModal(){$("#modal-root").innerHTML="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ---------------- Navigation ---------------- */
function go(view,opts){opts=opts||{};state.view=view;
  if(view==="signup")state.signupRole=opts.role||state.signupRole||"worker";
  state.tab=null;state.chatWith=null;render();window.scrollTo({top:0});}
function ctaFindWork(){const u=me();if(u&&u.role==="worker"){go("dash");}else go("signup",{role:"worker"});}
function ctaHire(){const u=me();if(u&&u.role==="contractor"){go("dash");}else go("signup",{role:"contractor"});}

/* ---------------- Header ---------------- */
function renderHeader(){const u=me();
  const langSel='<select class="lang-sel" onchange="setLang(this.value)" title="Language">'
    +'<option value="en"'+(lang==="en"?" selected":"")+'>EN</option>'
    +'<option value="hi"'+(lang==="hi"?" selected":"")+'>हिं</option>'
    +'<option value="or"'+(lang==="or"?" selected":"")+'>ଓଡ଼ି</option></select>';
  let right="";
  if(u){
    const roleTag=u.role==="worker"?t("role_worker"):u.role==="contractor"?t("role_contractor"):"Admin";
    right='<a class="user-chip">'+avatarHtml(u,"sm")+'<span class="uc-txt">'+esc(u.name)+'<span class="role-tag">'+roleTag+"</span></span></a>"
      +'<a class="btn btn-o btn-sm" onclick="go(\'dash\')">'+t("nav_dash")+"</a>"
      +'<a class="btn btn-g btn-sm" onclick="logout()">'+t("nav_logout")+"</a>";
  }else{
    right='<a class="btn btn-g btn-sm" onclick="go(\'login\')">'+t("nav_login")+"</a>"
      +'<a class="btn btn-p btn-sm" onclick="go(\'signup\')">'+t("nav_signup")+"</a>";
  }
  $("#topbar").innerHTML='<div class="container">'
    +'<a class="brand" onclick="go(\'home\')">'+logoSvg(92)+'</a>'
    +'<div class="nav-actions">'+langSel+'<button class="icon-btn" onclick="toggleTheme()" title="Theme">'+themeIcon()+"</button>"+right+"</div></div>";
  $("#foot-tag").textContent="“"+t("hero_t1")+" "+t("hero_t2")+" "+t("hero_t3")+"”";
  $("#foot-note").textContent=t("foot_note");
}

function handleLogin(e){e.preventDefault();
  const email=$("#li-email").value.trim().toLowerCase(),pass=$("#li-pass").value;
  const u=db.users.find(x=>x.email.toLowerCase()===email&&x.password===pass);
  if(!u){toast("⚠️ "+t("err_login"));return false;}
  setSession(u.id);toast(t("toast_welcome",esc(u.name.split(" ")[0])));go("dash");return false;}
function demoLogin(email){const u=db.users.find(x=>x.email===email);if(!u)return;
  setSession(u.id);toast(t("toast_welcome",esc(u.name.split(" ")[0])));go("dash");}
function logout(){setSession(null);toast(t("toast_logout"));go("home");}

function handleSignup(e){e.preventDefault();
  const g=id=>{const el=document.getElementById(id);return el?el.value.trim():"";};
  const name=g("su-name"),email=g("su-email").toLowerCase(),pass=g("su-pass"),city=g("su-city");
  if(!name||!email||!pass||!city){toast("⚠️ "+t("err_fields"));return false;}
  if(db.users.some(u=>u.email.toLowerCase()===email)){toast("⚠️ "+t("err_dup"));return false;}
  const role=state.signupRole,u={id:uid(),role,name,email,password:pass,phone:g("su-phone"),city,ts:Date.now()};
  if(role==="worker"){
    u.skills=[...document.querySelectorAll('input[name="skill"]:checked')].map(i=>i.value);
    if(!u.skills.length){toast("⚠️ "+t("err_skill"));return false;}
    u.exp=+g("su-exp")||0;u.wage=+g("su-wage")||400;
    u.avail=$("#su-avail")?$("#su-avail").value:"full";
    u.coop=false;u.coopId="";u.verified=false;
  }else{
    u.company=g("su-company")||name;
    u.services=[...document.querySelectorAll('input[name="service"]:checked')].map(i=>i.value);
  }
  db.users.push(u);saveDB();setSession(u.id);
  toast(t("toast_welcome",esc(name.split(" ")[0])));go("dash");return false;}

/* ---------------- MESSAGES ---------------- */
function chatPartners(u){const map={};db.messages.forEach(m=>{if(m.from===u.id)map[m.to]=Math.max(map[m.to]||0,m.ts);if(m.to===u.id)map[m.from]=Math.max(map[m.from]||0,m.ts);});
  return Object.entries(map).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);}
function chatContacts(u){
  const recent=chatPartners(u), seen=new Set(recent);
  let base=[];
  if(u.role==="worker") base=db.users.filter(x=>x.role==="contractor");
  else if(u.role==="contractor") base=db.users.filter(x=>x.role==="worker");
  else base=[];
  const extra=base.map(x=>x.id).filter(id=>id!==u.id&&!seen.has(id)).sort((a,b)=>{const A=getUser(a),B=getUser(b);return (A?(A.company||A.name):a).localeCompare(B?(B.company||B.name):b);});
  return recent.concat(extra);
}
function msgLayout(u){
  const partners=chatContacts(u);
  if((!state.chatWith||!partners.includes(state.chatWith))&&partners.length)state.chatWith=partners[0];
  if(!partners.length)return '<div class="empty">'+t("no_threads")+"</div>";
  return '<div class="chat-wrap"><div class="threads" id="threadList">'+threadsHtml(u)+'</div><div class="chat-pane" id="chatPane">'+chatPaneHtml(u)+"</div></div>";
}
function threadsHtml(u){const partners=chatContacts(u);
  return partners.map(pid=>{const p=getUser(pid);if(!p)return "";
    const msgs=db.messages.filter(m=>(m.from===u.id&&m.to===pid)||(m.from===pid&&m.to===u.id)).sort((a,b)=>a.ts-b.ts);
    const last=msgs[msgs.length-1];
    const label=p.role==="worker"?(p.skills||[]).join(", "):(p.company||p.name);
    return '<div class="thread '+(state.chatWith===pid?"active":"")+'" onclick="openChat(\''+pid+'\')">'+avatarHtml(p,"sm")
      +'<div class="grow"><b>'+esc(p.name)+'</b><span class="prev">'+(last?esc(last.text).slice(0,42):'Start chat · '+esc(label).slice(0,34))+"</span></div></div>";}).join("");}
function chatPaneHtml(u){
  if(!state.chatWith)return '<div class="empty" style="border:none;margin:auto">'+t("msg_empty")+"</div>";
  const p=getUser(state.chatWith);if(!p)return "";
  const msgs=db.messages.filter(m=>(m.from===u.id&&m.to===p.id)||(m.from===p.id&&m.to===u.id)).sort((a,b)=>a.ts-b.ts);
  return `<div class="chat-hd">${avatarHtml(p,"sm")}<div><div>${esc(p.name)}</div><div class="small muted" style="font-weight:400">${p.role==="worker"?esc(p.skills.join(", ")):esc(p.company||"")}</div></div></div>
  <div class="chat-body" id="chatBody">${msgs.map(m=>'<div class="bubble '+(m.from===u.id?"me":"them")+'">'+esc(m.text)+"<time>"+timeAgo(m.ts)+"</time></div>").join("")||'<div class="small muted" style="margin:auto">'+t("msg_empty")+"</div>"}</div>
  <div class="chat-in"><input class="input" id="msgInput" placeholder="${esc(t("msg_ph"))}" onkeydown="if(event.key==='Enter'){event.preventDefault();sendMsg()}">
  <button class="btn btn-p" onclick="sendMsg()">${t("btn_send")} ➤</button></div>`;}
function openChat(uid){const u=me();if(!u||u.role==="admin")return;state.chatWith=uid;
  if(state.view!=="dash"){state.view="dash";state.tab="msgs";}else state.tab="msgs";
  render();}
function sendMsg(){const u=me();const el=$("#msgInput");if(!u||!el||!state.chatWith)return;
  const txt=el.value.trim();if(!txt)return;
  db.messages.push({id:uid(),from:u.id,to:state.chatWith,text:txt,ts:Date.now()});saveDB();
  const pane=$("#chatPane");if(pane){pane.innerHTML=chatPaneHtml(u);const tl=$("#threadList");if(tl)tl.innerHTML=threadsHtml(u);
    const body=$("#chatBody");if(body)body.scrollTop=body.scrollHeight;const ni=$("#msgInput");if(ni)ni.focus();}}

function openRating(jobId,toId){const u=me();if(!u)return;
  if(hasReviewed(jobId,u.id)){return;}
  state.rate={jobId,toId};state.stars=5;renderRatingModal();}
function renderRatingModal(){const tgt=getUser(state.rate.toId);
  openModal(`<div class="modal-hd"><b>⭐ ${t("rate_title")}</b><button class="xbtn" onclick="closeModal()">✕</button></div>
  <div class="modal-bd" style="text-align:center">
    <div class="row" style="justify-content:center">${avatarHtml(tgt)}<b>${esc(tgt.name)}</b></div>
    <div class="rate-stars">${[1,2,3,4,5].map(n=>'<span class="'+(n<=state.stars?"on":"")+'" onclick="setStars('+n+')">★</span>').join("")}</div>
    <textarea class="input" id="rate-txt" placeholder="${esc(t("f_comment"))}"></textarea>
    <button class="btn btn-p mt" onclick="submitRating()">${t("btn_rate")} →</button></div>`);}
function setStars(n){state.stars=n;renderRatingModal();}
function submitRating(){const u=me();const txt=$("#rate-txt").value.trim();
  db.reviews.push({id:uid(),jobId:state.rate.jobId,from:u.id,to:state.rate.toId,stars:state.stars,text:txt,ts:Date.now()});
  saveDB();closeModal();toast(t("rate_toast"));render();}

/* ---------------- ADMIN tabs ---------------- */
function aTab(u){
  if(state.tab==="over")return aOver();
  if(state.tab==="ver")return aVer();
  if(state.tab==="jobs")return aJobs();
  return aComp();
}
function aOver(){
  const workers=db.users.filter(x=>x.role==="worker");
  const cards=[[workers.length,t("s_workers")],[workers.filter(w=>w.verified).length,t("s_verified")],[workers.filter(w=>!w.verified).length,t("s_pending")],
    [db.users.filter(x=>x.role==="contractor").length,t("s_contractors")],[db.jobs.filter(j=>j.status!=="completed").length,t("s_activejobs")],
    [db.jobs.filter(j=>j.status==="completed").length,t("s_donejobs")],[db.jobs.length,t("s_jobs")],[db.reports.filter(r=>r.status==="open").length,t("s_complaints")]];
  return '<h3 class="mb">🏛️ '+t("ad_over")+'</h3><div class="stat-grid">'+cards.map(c=>'<div class="card scard"><b>'+c[0]+"</b><span>"+c[1]+"</span></div>").join("")+"</div>";
}
function aVer(){
  const pend=db.users.filter(x=>x.role==="worker"&&!x.verified);
  if(!pend.length)return '<div class="empty">'+t("ad_none")+"</div>";
  return '<h3 class="mb">🔍 '+t("ad_pending_t")+'</h3><div style="display:flex;flex-direction:column;gap:11px">'+pend.map(w=>
    `<div class="card approw">${avatarHtml(w)}<div class="grow"><b>${esc(w.name)}</b>
      <div class="small muted">${esc(w.skills.join(", "))} · 📍 ${esc(w.city)} · 💼 ${w.exp} ${t("yrs")} · ${money(w.wage)}${t("per_day")}
      ${w.coop?" · 🤝 "+esc(w.coopId||t("coop_member")):""}</div></div>
      <button class="btn btn-o btn-sm" onclick="openWorker('${w.id}')">${t("btn_profile")}</button>
      <button class="btn btn-p btn-sm" onclick="adminVerify('${w.id}')">✓ ${t("btn_verify")}</button></div>`).join("")+"</div>";
}
function adminVerify(uid_){const w=getUser(uid_);if(w){w.verified=true;saveDB();toast(t("toast_verified"));render();}}
function aJobs(){
  const rows=db.jobs.slice().sort((a,b)=>b.created-a.created).map(j=>{const c=getUser(j.cid),w=j.hired?getUser(j.hired):null;
    return `<tr><td><b>${esc(j.title)}</b><div class="small muted">${esc(j.skill)} · 📍 ${esc(j.city)}</div></td>
      <td>${esc(c?(c.company||c.name):"—")}</td><td>${esc(w?w.name:"—")}</td>
      <td>${money(j.wage)}${j.unit==="day"?t("per_day"):t("per_job")} ${fairFlag(j)}</td>
      <td>${j.status==="open"?'<span class="st st-open">'+t("status_open")+"</span>":j.status==="hired"?'<span class="st st-hired">'+t("status_hired")+"</span>":'<span class="st st-done">'+t("status_done")+"</span>"}</td></tr>`;}).join("");
  return '<h3 class="mb">📊 '+t("ad_jobs_t")+'</h3><div class="card" style="overflow-x:auto"><table class="tbl"><tr><th>'+t("lbl_jobtitle")+'</th><th>'+t("role_contractor")+'</th><th>'+t("role_worker")+'</th><th>'+t("lbl_wage")+"</th><th>Status</th></tr>"+rows+"</table></div>";
}
function aComp(){
  const reps=db.reports.slice().sort((a,b)=>b.ts-a.ts);
  if(!reps.length)return '<div class="empty">'+t("ad_nocomp")+"</div>";
  const tname={payment:t("rt_payment"),workplace:t("rt_workplace"),other:t("rt_other")};
  return '<h3 class="mb">🚨 '+t("ad_comp_t")+'</h3>'+reps.map(r=>{const rep=getUser(r.uid);
    return `<div class="card comprow"><div class="sp-between"><div class="row"><span class="chip ${r.type==="payment"?"a":"p"}">${tname[r.type]||r.type}</span>
      <b>${esc(r.against||"—")}</b></div>${r.status==="open"?'<span class="st st-pend">'+t("st_open")+'</span>':'<span class="st st-acc">'+t("st_resolved")+"</span>"}</div>
      <div style="font-size:13.5px">${esc(r.details)}</div>
      <div class="sp-between"><span class="small muted">${t("reported_by")}: <b style="color:var(--text)">${esc(rep?rep.name:"?")}</b> · ${timeAgo(r.ts)}</span>
      ${r.status==="open"?'<button class="btn btn-p btn-sm" onclick="resolveReport(\''+r.id+"')\">✓ "+t("btn_resolve")+"</button>":""}</div></div>`;}).join("");
}
function resolveReport(id){const r=db.reports.find(x=>x.id===id);if(r){r.status="resolved";saveDB();toast(t("toast_resolved"));render();}}

/* ================================================================
   RENDER ROOT
================================================================ */
function render(){
  renderHeader();
  const u=me();let html="";
  if(state.view==="login")html=vLogin();
  else if(state.view==="signup")html=vSignup();
  else if(state.view==="dash")html=u?vDash(u):vHome();
  else html=vHome();
  $("#view").innerHTML=html;
  if(state.tab==="msgs"&&u){const body=$("#chatBody");if(body)body.scrollTop=body.scrollHeight;}
}

/* ---------------- Init ---------------- */
loadDB();applyTheme();document.documentElement.lang=lang==="or"?"or":lang;render();
